name: EDA Flow Manager CI (Pipeline de V&V)

# O robô do GitHub vai rodar toda vez que houver um Push ou Pull Request na main
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest # O GitHub liga um servidor Linux zerado

    steps:
    - name: 1. Checkout do código
      uses: actions/checkout@v4

    - name: 2. Configurar Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven # Acelera a execução guardando as dependências

    - name: 3. Verificação Estática (Checkstyle - Tarefa 2)
      # Entra na pasta do Gerente e roda o linter
      run: mvn -f project-manager/pom.xml checkstyle:check

    - name: 4. Testes Unitários e de Integração (JUnit/Mockito - Tarefa 3)
      # Roda a suíte de testes do back-end isolada do motor físico
      run: mvn -f project-manager/pom.xml test