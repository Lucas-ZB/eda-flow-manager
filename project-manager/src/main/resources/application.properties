# Banco H2 em memória
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:pitangadb;DB_CLOSE_DELAY=-1

# Força o Hibernate a apagar e recriar o banco perfeitamente a cada inicialização
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.log.sql=true

# Portas
quarkus.http.port=8082
quarkus.rest-client.analytics-api.url=http://localhost:8081